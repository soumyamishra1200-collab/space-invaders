<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird Classic</title>
  <meta name="description" content="A classic Flappy Bird arcade game built with HTML5 Canvas, responsive controls, procedural audio, and smooth physics." />
  <meta property="og:title" content="Flappy Bird Classic" />
  <meta property="og:description" content="A classic Flappy Bird arcade game built with HTML5 Canvas, responsive controls, procedural audio, and smooth physics." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1e24;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 440px;
      max-height: 720px;
      aspect-ratio: 380 / 600;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      background: #000;
      overflow: hidden;
    }

    @media (min-width: 500px) and (min-height: 700px) {
      #game-container {
        border-radius: 14px;
        border: 4px solid #2d3748;
      }
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      cursor: pointer;
    }

    /* Accessibility help note for keyboard shortcuts */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="sr-only" aria-live="polite" id="game-status">Flappy Bird Game. Press Space or Click to Jump.</div>
  </div>

  <script>
    (function() {
      'use strict';

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const statusAnnouncer = document.getElementById('game-status');

      // Virtual game dimension coordinates
      const V_WIDTH = 380;
      const V_HEIGHT = 600;
      const GROUND_HEIGHT = 96;

      // Handle High-DPI screens
      let dpr = window.devicePixelRatio || 1;
      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        dpr = window.devicePixelRatio || 1;
        canvas.width = V_WIDTH * dpr;
        canvas.height = V_HEIGHT * dpr;
        ctx.resetTransform?.();
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // ==========================================
      // SYNTHESIZED PROCEDURAL WEB AUDIO (ZERO ASSETS)
      // ==========================================
      let audioCtx = null;
      let soundEnabled = true;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playSound(type) {
        if (!soundEnabled) return;
        try {
          const ac = getAudioContext();
          if (!ac) return;
          const now = ac.currentTime;

          if (type === 'flap') {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.09);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(now);
            osc.stop(now + 0.11);
          } else if (type === 'score') {
            // High chime ding
            const osc1 = ac.createOscillator();
            const osc2 = ac.createOscillator();
            const gain = ac.createGain();
            osc1.type = 'sine';
            osc2.type = 'sine';
            osc1.frequency.setValueAtTime(784, now); // G5
            osc2.frequency.setValueAtTime(1046.5, now + 0.08); // C6
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.setValueAtTime(0.28, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ac.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);
            osc2.start(now + 0.08);
            osc2.stop(now + 0.35);
          } else if (type === 'hit') {
            // Low thud & noise
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(now);
            osc.stop(now + 0.18);
          } else if (type === 'die') {
            // Descending slide
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.36);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(now);
            osc.stop(now + 0.38);
          } else if (type === 'swoosh') {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(now);
            osc.stop(now + 0.13);
          }
        } catch (e) {
          // Audio autoplay block or unsupported - game continues safely
        }
      }

      // ==========================================
      // GAME STATE & CONSTANTS
      // ==========================================
      const STATE = {
        START: 0,
        PLAYING: 1,
        GAMEOVER: 2
      };

      let currentState = STATE.START;
      let score = 0;
      let highScore = parseInt(localStorage.getItem('flappy_classic_highscore') || '0', 10);
      let frames = 0;
      let isNewHighScore = false;

      // Camera screen shake & white collision flash
      let shakeTime = 0;
      let flashAlpha = 0;

      // Audio button bounds
      const soundBtnRect = { x: V_WIDTH - 42, y: 14, w: 32, h: 32 };
      // Play again button bounds
      const replayBtnRect = { x: V_WIDTH / 2 - 75, y: 395, w: 150, h: 48 };

      // ==========================================
      // BIRD OBJECT
      // ==========================================
      const bird = {
        x: 88,
        y: 260,
        radius: 15,
        velocity: 0,
        gravity: 0.36,
        jumpPower: -6.8,
        maxFallSpeed: 9.2,
        rotation: 0,
        wingAngle: 0,
        wingSpeed: 0.18,

        reset() {
          this.x = 88;
          this.y = 260;
          this.velocity = 0;
          this.rotation = 0;
          this.wingAngle = 0;
        },

        flap() {
          this.velocity = this.jumpPower;
          playSound('flap');
          // Add puff particles
          addPuff(this.x - 12, this.y + 4);
        },

        update() {
          if (currentState === STATE.START) {
            // Gentle hovering idle motion
            this.y = 250 + Math.sin(frames * 0.08) * 8;
            this.rotation = 0;
            this.wingAngle += 0.18;
            return;
          }

          if (currentState === STATE.PLAYING) {
            this.velocity += this.gravity;
            if (this.velocity > this.maxFallSpeed) {
              this.velocity = this.maxFallSpeed;
            }
            this.y += this.velocity;

            // Rotation physics
            if (this.velocity < 0) {
              // Pointing up when flap
              this.rotation = Math.max(-0.45, this.velocity * 0.07);
              this.wingAngle += 0.35;
            } else {
              // Smoothly tilts downwards when dropping
              this.rotation = Math.min(Math.PI / 2, this.rotation + 0.05 + this.velocity * 0.015);
              this.wingAngle += 0.08;
            }

            // Ground collision
            const groundLimit = V_HEIGHT - GROUND_HEIGHT - this.radius;
            if (this.y >= groundLimit) {
              this.y = groundLimit;
              triggerGameOver(true);
            }

            // Ceiling limit
            if (this.y < this.radius) {
              this.y = this.radius;
              this.velocity = 0;
            }
          } else if (currentState === STATE.GAMEOVER) {
            // Fall to ground if in air
            const groundLimit = V_HEIGHT - GROUND_HEIGHT - this.radius;
            if (this.y < groundLimit) {
              this.velocity += this.gravity * 1.5;
              this.y += this.velocity;
              this.rotation = Math.min(Math.PI / 2, this.rotation + 0.1);
              if (this.y >= groundLimit) {
                this.y = groundLimit;
              }
            }
          }
        },

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);

          // Subtle shadow underneath
          ctx.beginPath();
          ctx.ellipse(0, 16, 12, 4, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
          ctx.fill();

          // Bird Main Body (Yellow Oval)
          ctx.beginPath();
          ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#f9c80e';
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#3d2508';
          ctx.stroke();

          // Belly patch (Creamy lighter yellow)
          ctx.beginPath();
          ctx.ellipse(-3, 4, 11, 7, -0.15, 0, Math.PI * 2);
          ctx.fillStyle = '#ffef96';
          ctx.fill();

          // Flapping Wing
          ctx.save();
          const wingFlapOffset = Math.sin(this.wingAngle) * 7;
          ctx.translate(-7, 1);
          ctx.rotate(wingFlapOffset * 0.07);
          ctx.beginPath();
          ctx.ellipse(0, 0, 9, 6, -0.2, 0, Math.PI * 2);
          ctx.fillStyle = '#fff4a3';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#3d2508';
          ctx.stroke();
          // Feather detail inside wing
          ctx.beginPath();
          ctx.arc(-2, 0, 4, 0, Math.PI);
          ctx.strokeStyle = '#d49b0e';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.restore();

          // Beak / Bill (Vibrant Orange)
          ctx.beginPath();
          ctx.moveTo(11, -1);
          ctx.lineTo(24, 4);
          ctx.lineTo(10, 8);
          ctx.closePath();
          ctx.fillStyle = '#f85a2b';
          ctx.fill();
          ctx.lineWidth = 2.2;
          ctx.strokeStyle = '#3d2508';
          ctx.stroke();

          // Beak dividing mouth line
          ctx.beginPath();
          ctx.moveTo(12, 3);
          ctx.lineTo(22, 4);
          ctx.strokeStyle = '#851e04';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Eye (Big White Cartoon Eye with pupil & glint)
          ctx.beginPath();
          ctx.ellipse(7, -6, 6, 7, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#3d2508';
          ctx.stroke();

          // Pupil
          ctx.beginPath();
          ctx.arc(8.5, -6, 3, 0, Math.PI * 2);
          ctx.fillStyle = '#1c1b1b';
          ctx.fill();

          // Eye specular glint
          ctx.beginPath();
          ctx.arc(9.8, -7.5, 1.2, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();

          // Cheek blush
          ctx.beginPath();
          ctx.arc(4, 3, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 90, 80, 0.45)';
          ctx.fill();

          ctx.restore();
        }
      };

      // ==========================================
      // PARTICLES (Puffs & Sparkles)
      // ==========================================
      const particles = [];

      function addPuff(x, y) {
        for (let i = 0; i < 4; i++) {
          particles.push({
            type: 'smoke',
            x: x + (Math.random() * 6 - 3),
            y: y + (Math.random() * 6 - 3),
            vx: -1.8 - Math.random() * 1.5,
            vy: (Math.random() - 0.5) * 1.2,
            size: 4 + Math.random() * 4,
            alpha: 0.7,
            decay: 0.04
          });
        }
      }

      function addSparkles(x, y) {
        for (let i = 0; i < 9; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 2.8;
          particles.push({
            type: 'star',
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3 + Math.random() * 3,
            color: ['#fffa65', '#ff9f1a', '#ff4d4d', '#70a1ff'][Math.floor(Math.random() * 4)],
            alpha: 1,
            decay: 0.03
          });
        }
      }

      function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;
          if (p.type === 'smoke') {
            p.size += 0.2;
          }
          if (p.alpha <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      function drawParticles() {
        for (const p of particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          if (p.type === 'smoke') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
          } else if (p.type === 'star') {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // ==========================================
      // PIPES (OBSTACLES)
      // ==========================================
      const PIPE_WIDTH = 58;
      const PIPE_CAP_HEIGHT = 26;
      const PIPE_CAP_OVERHANG = 5; // Extends out on left & right
      const GAP_SIZE = 136; // Generous, fair, playable gap
      const PIPE_SPEED = 2.1;
      const PIPE_SPAWN_INTERVAL = 115; // In frames (~2.1 seconds)

      let pipes = [];

      function spawnPipe() {
        // Fair bounds
        const minTop = 50;
        const maxTop = V_HEIGHT - GROUND_HEIGHT - GAP_SIZE - 50;
        const topHeight = Math.floor(minTop + Math.random() * (maxTop - minTop));

        pipes.push({
          x: V_WIDTH + 10,
          top: topHeight,
          bottom: V_HEIGHT - GROUND_HEIGHT - (topHeight + GAP_SIZE),
          passed: false
        });
      }

      function resetPipes() {
        pipes = [];
      }

      function updatePipes() {
        if (currentState !== STATE.PLAYING) return;

        // Spawn logic
        if (frames % PIPE_SPAWN_INTERVAL === 0) {
          spawnPipe();
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          const pipe = pipes[i];
          pipe.x -= PIPE_SPEED;

          // Score check
          if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
            pipe.passed = true;
            score++;
            playSound('score');
            addSparkles(pipe.x + PIPE_WIDTH, pipe.top + GAP_SIZE / 2);
            statusAnnouncer.textContent = `Score: ${score}`;
          }

          // Offscreen removal
          if (pipe.x + PIPE_WIDTH + 20 < 0) {
            pipes.splice(i, 1);
            continue;
          }

          // Precise Collision Detection (AABB vs Bird Circle)
          const birdBox = {
            left: bird.x - bird.radius + 3,
            right: bird.x + bird.radius - 3,
            top: bird.y - bird.radius + 3,
            bottom: bird.y + bird.radius - 3
          };

          // Top Pipe collision bounds
          const topCol = {
            left: pipe.x,
            right: pipe.x + PIPE_WIDTH,
            top: 0,
            bottom: pipe.top
          };

          // Bottom Pipe collision bounds
          const bottomCol = {
            left: pipe.x,
            right: pipe.x + PIPE_WIDTH,
            top: V_HEIGHT - GROUND_HEIGHT - pipe.bottom,
            bottom: V_HEIGHT - GROUND_HEIGHT
          };

          if (
            (birdBox.right > topCol.left && birdBox.left < topCol.right && birdBox.top < topCol.bottom) ||
            (birdBox.right > bottomCol.left && birdBox.left < bottomCol.right && birdBox.bottom > bottomCol.top)
          ) {
            triggerGameOver(false);
          }
        }
      }

      function drawSinglePipe(x, y, width, height, isTop) {
        ctx.save();

        const capW = width + PIPE_CAP_OVERHANG * 2;
        const capX = x - PIPE_CAP_OVERHANG;
        const capH = PIPE_CAP_HEIGHT;
        const capY = isTop ? y + height - capH : y;
        const bodyH = height - capH;
        const bodyY = isTop ? y : y + capH;

        // --- Pipe Body ---
        if (bodyH > 0) {
          const bodyGrad = ctx.createLinearGradient(x, 0, x + width, 0);
          bodyGrad.addColorStop(0.0, '#558d19');
          bodyGrad.addColorStop(0.18, '#8de535');
          bodyGrad.addColorStop(0.45, '#73c322');
          bodyGrad.addColorStop(0.85, '#508916');
          bodyGrad.addColorStop(1.0, '#355c0e');

          ctx.fillStyle = bodyGrad;
          ctx.fillRect(x, bodyY, width, bodyH);

          // Dark border
          ctx.strokeStyle = '#1d3805';
          ctx.lineWidth = 2.5;
          ctx.strokeRect(x, bodyY, width, bodyH);

          // Specular vertical highlight stripe
          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.fillRect(x + 7, bodyY, 4, bodyH);
        }

        // --- Pipe Rim Cap ---
        const capGrad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
        capGrad.addColorStop(0.0, '#5ea11a');
        capGrad.addColorStop(0.18, '#9cf33d');
        capGrad.addColorStop(0.45, '#7bce25');
        capGrad.addColorStop(0.85, '#559017');
        capGrad.addColorStop(1.0, '#34580e');

        ctx.fillStyle = capGrad;
        ctx.fillRect(capX, capY, capW, capH);

        // Cap border
        ctx.strokeStyle = '#1d3805';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(capX, capY, capW, capH);

        // Cap specular highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(capX + 8, capY + 3, 5, capH - 6);

        // Lip shadow rim
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        if (isTop) {
          ctx.fillRect(capX, capY + capH - 4, capW, 3);
        } else {
          ctx.fillRect(capX, capY + 1, capW, 3);
        }

        ctx.restore();
      }

      function drawPipes() {
        for (const pipe of pipes) {
          // Top pipe
          drawSinglePipe(pipe.x, 0, PIPE_WIDTH, pipe.top, true);
          // Bottom pipe
          const bottomY = V_HEIGHT - GROUND_HEIGHT - pipe.bottom;
          drawSinglePipe(pipe.x, bottomY, PIPE_WIDTH, pipe.bottom, false);
        }
      }

      // ==========================================
      // ENVIRONMENT, BACKGROUND & PARALLAX
      // ==========================================
      let groundScroll = 0;
      let cloudScroll = 0;
      let cityScroll = 0;

      function updateEnvironment() {
        if (currentState !== STATE.GAMEOVER) {
          groundScroll = (groundScroll + PIPE_SPEED) % 24;
          cloudScroll = (cloudScroll + 0.35) % V_WIDTH;
          cityScroll = (cityScroll + 0.6) % V_WIDTH;
        }
      }

      function drawBackground() {
        // Sky Gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT - GROUND_HEIGHT);
        skyGrad.addColorStop(0.0, '#3aa6c8');
        skyGrad.addColorStop(0.65, '#76cce5');
        skyGrad.addColorStop(1.0, '#c7eaf2');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        // Distant fluffy clouds (slow scrolling parallax)
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        for (let offsetX of [-V_WIDTH, 0, V_WIDTH]) {
          const cx = offsetX - cloudScroll;
          // Cloud 1
          drawCloud(cx + 60, 95, 38);
          // Cloud 2
          drawCloud(cx + 220, 140, 28);
          // Cloud 3
          drawCloud(cx + 340, 80, 32);
        }
        ctx.restore();

        // City skyline silhouette / distant mountains
        ctx.save();
        ctx.fillStyle = '#9bd0c8';
        for (let offsetX of [-V_WIDTH, 0, V_WIDTH]) {
          const sx = offsetX - cityScroll;
          drawSkyline(sx);
        }
        ctx.restore();

        // Foreground hills / bushes behind pipes
        ctx.save();
        ctx.fillStyle = '#65b267';
        for (let offsetX of [-V_WIDTH, 0, V_WIDTH]) {
          const bx = offsetX - (cityScroll * 1.5) % V_WIDTH;
          drawBushes(bx);
        }
        ctx.restore();
      }

      function drawCloud(x, y, r) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.arc(x + r * 0.7, y - r * 0.2, r * 0.8, 0, Math.PI * 2);
        ctx.arc(x + r * 1.3, y, r * 0.65, 0, Math.PI * 2);
        ctx.arc(x + r * 0.5, y + r * 0.3, r * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawSkyline(baseX) {
        const by = V_HEIGHT - GROUND_HEIGHT;
        // Building silhouettes
        const buildings = [
          { x: 10, w: 32, h: 80 },
          { x: 45, w: 22, h: 110 },
          { x: 72, w: 38, h: 70 },
          { x: 115, w: 42, h: 125 },
          { x: 162, w: 28, h: 90 },
          { x: 195, w: 36, h: 105 },
          { x: 236, w: 48, h: 75 },
          { x: 288, w: 30, h: 115 },
          { x: 322, w: 45, h: 85 }
        ];

        for (const b of buildings) {
          ctx.fillRect(baseX + b.x, by - b.h, b.w, b.h);
          // Windows
          ctx.fillStyle = '#bfe5df';
          for (let wy = by - b.h + 8; wy < by - 10; wy += 14) {
            ctx.fillRect(baseX + b.x + 5, wy, 4, 6);
            if (b.w > 26) {
              ctx.fillRect(baseX + b.x + 14, wy, 4, 6);
            }
          }
          ctx.fillStyle = '#9bd0c8';
        }
      }

      function drawBushes(baseX) {
        const by = V_HEIGHT - GROUND_HEIGHT;
        ctx.beginPath();
        ctx.arc(baseX + 40, by, 35, Math.PI, 0);
        ctx.arc(baseX + 110, by, 45, Math.PI, 0);
        ctx.arc(baseX + 190, by, 38, Math.PI, 0);
        ctx.arc(baseX + 270, by, 50, Math.PI, 0);
        ctx.arc(baseX + 350, by, 36, Math.PI, 0);
        ctx.fill();
      }

      function drawGround() {
        const gy = V_HEIGHT - GROUND_HEIGHT;

        // Soil Body
        ctx.fillStyle = '#dcd592';
        ctx.fillRect(0, gy, V_WIDTH, GROUND_HEIGHT);

        // Diagonal alternating soil stripes pattern
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, gy + 14, V_WIDTH, GROUND_HEIGHT - 14);
        ctx.clip();
        ctx.strokeStyle = '#c4b975';
        ctx.lineWidth = 3.5;
        const stripeGap = 16;
        for (let x = -30 - groundScroll; x < V_WIDTH + 40; x += stripeGap) {
          ctx.beginPath();
          ctx.moveTo(x, gy + 14);
          ctx.lineTo(x - 18, gy + GROUND_HEIGHT);
          ctx.stroke();
        }
        ctx.restore();

        // Top green grass band
        ctx.fillStyle = '#73bf2e';
        ctx.fillRect(0, gy, V_WIDTH, 14);

        // Grass bottom trim shadow
        ctx.fillStyle = '#55941c';
        ctx.fillRect(0, gy + 11, V_WIDTH, 3);

        // Ground upper edge dark outline
        ctx.strokeStyle = '#395e12';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(V_WIDTH, gy);
        ctx.stroke();
      }

      // ==========================================
      // UI SCREENS, TEXT & BUTTONS
      // ==========================================
      function drawHeaderScore() {
        if (currentState === STATE.PLAYING) {
          drawOutlinedText(`${score}`, V_WIDTH / 2, 80, 48, '#ffffff', '#000000', 5);
        }
      }

      function drawOutlinedText(text, x, y, size, fill, stroke, strokeW) {
        ctx.save();
        ctx.font = `900 ${size}px 'Impact', 'Trebuchet MS', 'Arial Black', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = strokeW;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = stroke;
        ctx.strokeText(text, x, y);
        ctx.fillStyle = fill;
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      function drawStartScreen() {
        // Game Title
        drawOutlinedText('FLAPPY BIRD', V_WIDTH / 2, 140, 44, '#f8b400', '#2d1800', 6);

        // Tap icon / Hand tutorial
        ctx.save();
        const floatY = Math.sin(frames * 0.1) * 4;
        ctx.translate(V_WIDTH / 2, 340 + floatY);

        // Rounded tap guide box
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        roundRect(ctx, -100, -32, 200, 64, 12);
        ctx.fill();

        ctx.font = "bold 15px 'Segoe UI', sans-serif";
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('TAP OR PRESS SPACE', 0, -6);
        ctx.fillStyle = '#f8b400';
        ctx.font = "13px 'Segoe UI', sans-serif";
        ctx.fillText('TO FLAP & FLY', 0, 16);
        ctx.restore();

        // Highscore notice on start screen
        if (highScore > 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
          roundRect(ctx, V_WIDTH / 2 - 75, 430, 150, 32, 16);
          ctx.fill();
          ctx.fillStyle = '#f6e58d';
          ctx.font = "bold 13px 'Segoe UI', sans-serif";
          ctx.textAlign = 'center';
          ctx.fillText(`BEST SCORE: ${highScore}`, V_WIDTH / 2, 451);
          ctx.restore();
        }
      }

      let gameOverPanelProgress = 0;

      function drawGameOverScreen() {
        gameOverPanelProgress = Math.min(1, gameOverPanelProgress + 0.08);
        const ease = 1 - Math.pow(1 - gameOverPanelProgress, 3); // ease-out cubic
        const panelY = 170 + (1 - ease) * 120;

        // "GAME OVER" title with bold arcade shadow
        drawOutlinedText('GAME OVER', V_WIDTH / 2, 115, 42, '#eb3b5a', '#2d0800', 6);

        // Scoreboard Box
        ctx.save();
        ctx.translate(V_WIDTH / 2 - 120, panelY);

        // Outer Board
        ctx.fillStyle = '#e8d89a';
        roundRect(ctx, 0, 0, 240, 140, 10);
        ctx.fill();
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#4b3820';
        ctx.stroke();

        // Inner Inset
        ctx.fillStyle = '#d8c47d';
        roundRect(ctx, 8, 8, 224, 124, 6);
        ctx.fill();

        // "MEDAL" Label
        ctx.fillStyle = '#835824';
        ctx.font = "bold 13px 'Segoe UI', sans-serif";
        ctx.textAlign = 'left';
        ctx.fillText('MEDAL', 24, 30);

        // Medal Icon
        drawMedal(50, 75, score);

        // "SCORE" Label & Value
        ctx.textAlign = 'right';
        ctx.fillStyle = '#835824';
        ctx.fillText('SCORE', 218, 30);
        drawOutlinedText(`${score}`, 215, 52, 24, '#ffffff', '#333333', 3.5);

        // "BEST" Label & Value
        ctx.fillStyle = '#835824';
        ctx.fillText('BEST', 218, 84);
        drawOutlinedText(`${highScore}`, 215, 106, 24, '#ffffff', '#333333', 3.5);

        // "NEW" Badge if beaten high score
        if (isNewHighScore) {
          ctx.save();
          ctx.translate(138, 70);
          ctx.rotate(-0.1);
          ctx.fillStyle = '#ff3838';
          roundRect(ctx, 0, 0, 36, 16, 4);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = "bold 10px 'Segoe UI', sans-serif";
          ctx.textAlign = 'center';
          ctx.fillText('NEW', 18, 12);
          ctx.restore();
        }

        ctx.restore();

        // "PLAY AGAIN" Button
        if (gameOverPanelProgress >= 0.7) {
          ctx.save();
          ctx.translate(replayBtnRect.x, replayBtnRect.y);
          const btnGrad = ctx.createLinearGradient(0, 0, 0, replayBtnRect.h);
          btnGrad.addColorStop(0, '#2ecc71');
          btnGrad.addColorStop(1, '#27ae60');
          ctx.fillStyle = btnGrad;
          roundRect(ctx, 0, 0, replayBtnRect.w, replayBtnRect.h, 10);
          ctx.fill();

          ctx.lineWidth = 3;
          ctx.strokeStyle = '#1b4d2e';
          ctx.stroke();

          // Button Top Highlight
          ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
          roundRect(ctx, 4, 3, replayBtnRect.w - 8, 12, 6);
          ctx.fill();

          drawOutlinedText('PLAY AGAIN', replayBtnRect.w / 2, replayBtnRect.h / 2 + 1, 20, '#ffffff', '#1b4d2e', 3.5);
          ctx.restore();
        }
      }

      function drawMedal(cx, cy, finalScore) {
        if (finalScore < 10) {
          // No medal yet
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, 22, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
          ctx.fill();
          ctx.strokeStyle = '#ab985a';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#ab985a';
          ctx.font = "bold 10px 'Segoe UI', sans-serif";
          ctx.textAlign = 'center';
          ctx.fillText('NONE', cx, cy + 3.5);
          ctx.restore();
          return;
        }

        let outerColor, innerColor, label;
        if (finalScore >= 40) {
          outerColor = '#a8e6cf'; innerColor = '#e0fbf2'; label = 'PLAT';
        } else if (finalScore >= 30) {
          outerColor = '#f1c40f'; innerColor = '#fef5b5'; label = 'GOLD';
        } else if (finalScore >= 20) {
          outerColor = '#bdc3c7'; innerColor = '#ecf0f1'; label = 'SLVR';
        } else {
          outerColor = '#e67e22'; innerColor = '#f8c291'; label = 'BRNZ';
        }

        ctx.save();
        // Ribbon
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(cx - 10, cy - 22);
        ctx.lineTo(cx, cy - 5);
        ctx.lineTo(cx + 10, cy - 22);
        ctx.fill();

        // Medal circle
        ctx.beginPath();
        ctx.arc(cx, cy, 21, 0, Math.PI * 2);
        ctx.fillStyle = outerColor;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#4a3212';
        ctx.stroke();

        // Inner circle
        ctx.beginPath();
        ctx.arc(cx, cy, 15, 0, Math.PI * 2);
        ctx.fillStyle = innerColor;
        ctx.fill();

        // Medal star / glitter sparkle
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx - 5, cy - 6, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#4a3212';
        ctx.font = "bold 9px 'Segoe UI', sans-serif";
        ctx.textAlign = 'center';
        ctx.fillText(label, cx, cy + 3.5);

        ctx.restore();
      }

      function drawSoundToggle() {
        ctx.save();
        ctx.translate(soundBtnRect.x, soundBtnRect.y);

        // Button background
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        roundRect(ctx, 0, 0, soundBtnRect.w, soundBtnRect.h, 8);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Speaker icon
        ctx.fillStyle = soundEnabled ? '#ffffff' : '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(7, 12);
        ctx.lineTo(12, 12);
        ctx.lineTo(18, 7);
        ctx.lineTo(18, 25);
        ctx.lineTo(12, 20);
        ctx.lineTo(7, 20);
        ctx.closePath();
        ctx.fill();

        if (soundEnabled) {
          // Sound wave arcs
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(17, 16, 6, -0.6, 0.6);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(17, 16, 10, -0.7, 0.7);
          ctx.stroke();
        } else {
          // X mark
          ctx.strokeStyle = '#e74c3c';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(21, 11);
          ctx.lineTo(27, 21);
          ctx.moveTo(27, 11);
          ctx.lineTo(21, 21);
          ctx.stroke();
        }

        ctx.restore();
      }

      function roundRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.moveTo(x + radius, y);
        context.lineTo(x + width - radius, y);
        context.quadraticCurveTo(x + width, y, x + width, y + radius);
        context.lineTo(x + width, y + height - radius);
        context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        context.lineTo(x + radius, y + height);
        context.quadraticCurveTo(x, y + height, x, y + height - radius);
        context.lineTo(x, y + radius);
        context.quadraticCurveTo(x, y, x + radius, y);
        context.closePath();
      }

      // ==========================================
      // GAME CONTROL & LOOP
      // ==========================================
      function triggerGameOver(hitGround) {
        if (currentState === STATE.GAMEOVER) return;

        currentState = STATE.GAMEOVER;
        gameOverPanelProgress = 0;
        shakeTime = 12;
        flashAlpha = 0.85;

        playSound('hit');
        if (!hitGround) {
          setTimeout(() => playSound('die'), 120);
        }

        if (score > highScore) {
          highScore = score;
          isNewHighScore = true;
          try {
            localStorage.setItem('flappy_classic_highscore', highScore.toString());
          } catch (e) {}
        } else {
          isNewHighScore = false;
        }

        statusAnnouncer.textContent = `Game Over! Score: ${score}, Best: ${highScore}. Press Space or tap Play Again to restart.`;
      }

      function handleAction(clientX, clientY) {
        getAudioContext();

        // Check Sound Toggle button
        if (clientX !== undefined && clientY !== undefined) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = V_WIDTH / rect.width;
          const scaleY = V_HEIGHT / rect.height;
          const gx = (clientX - rect.left) * scaleX;
          const gy = (clientY - rect.top) * scaleY;

          if (
            gx >= soundBtnRect.x && gx <= soundBtnRect.x + soundBtnRect.w &&
            gy >= soundBtnRect.y && gy <= soundBtnRect.y + soundBtnRect.h
          ) {
            soundEnabled = !soundEnabled;
            if (soundEnabled) playSound('flap');
            return;
          }

          // If in GAME OVER state, check Play Again button
          if (currentState === STATE.GAMEOVER) {
            if (
              gx >= replayBtnRect.x && gx <= replayBtnRect.x + replayBtnRect.w &&
              gy >= replayBtnRect.y && gy <= replayBtnRect.y + replayBtnRect.h
            ) {
              restartGame();
              return;
            }
          }
        }

        if (currentState === STATE.START) {
          currentState = STATE.PLAYING;
          bird.flap();
        } else if (currentState === STATE.PLAYING) {
          bird.flap();
        } else if (currentState === STATE.GAMEOVER) {
          // If clicked anywhere after small delay, restart
          if (gameOverPanelProgress >= 0.7) {
            restartGame();
          }
        }
      }

      function restartGame() {
        playSound('swoosh');
        score = 0;
        frames = 0;
        flashAlpha = 0;
        shakeTime = 0;
        gameOverPanelProgress = 0;
        isNewHighScore = false;
        bird.reset();
        resetPipes();
        particles.length = 0;
        currentState = STATE.START;
        statusAnnouncer.textContent = `Game Ready. Press Space or Tap to Jump.`;
      }

      // Event Listeners
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') {
          e.preventDefault();
          handleAction();
        }
      });

      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handleAction(e.clientX, e.clientY);
      });

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches && e.touches[0]) {
          handleAction(e.touches[0].clientX, e.touches[0].clientY);
        } else {
          handleAction();
        }
      }, { passive: false });

      // ==========================================
      // MAIN ANIMATION LOOP
      // ==========================================
      function gameLoop() {
        frames++;

        // Update physics
        bird.update();
        updatePipes();
        updateEnvironment();
        updateParticles();

        // Screen shake calculation
        let shakeOffsetX = 0;
        let shakeOffsetY = 0;
        if (shakeTime > 0) {
          shakeOffsetX = (Math.random() - 0.5) * shakeTime * 0.9;
          shakeOffsetY = (Math.random() - 0.5) * shakeTime * 0.9;
          shakeTime--;
        }

        ctx.save();
        ctx.translate(shakeOffsetX, shakeOffsetY);

        // Rendering order
        drawBackground();
        drawPipes();
        drawGround();
        drawParticles();
        bird.draw();
        drawHeaderScore();

        if (currentState === STATE.START) {
          drawStartScreen();
        } else if (currentState === STATE.GAMEOVER) {
          drawGameOverScreen();
        }

        drawSoundToggle();

        // White Collision Flash
        if (flashAlpha > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
          ctx.fillRect(-10, -10, V_WIDTH + 20, V_HEIGHT + 20);
          flashAlpha = Math.max(0, flashAlpha - 0.08);
        }

        ctx.restore();

        requestAnimationFrame(gameLoop);
      }

      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
