<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Neon Galaxian Invaders</title>
    <meta name="description" content="A high-performance retro-modern neon Space Invaders and Galaxian arcade game built with HTML5 Canvas, featuring Galaxian diving attacks, destructible bunkers, and particle explosions." />
    <meta property="og:title" content="Neon Galaxian Invaders" />
    <meta property="og:description" content="A high-performance retro-modern neon Space Invaders and Galaxian arcade game built with HTML5 Canvas, featuring Galaxian diving attacks, destructible bunkers, and particle explosions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        background-color: #030712;
        background-image: 
          radial-gradient(circle at 50% 20%, rgba(17, 24, 39, 0.9) 0%, #030712 75%),
          radial-gradient(circle at 10% 80%, rgba(6, 78, 59, 0.15) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(131, 24, 67, 0.15) 0%, transparent 40%);
        min-height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Orbitron', 'Press Start 2P', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        touch-action: manipulation;
      }

      /* Arcade Machine Outer Frame */
      #game-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        padding: 8px;
      }

      #canvas-wrapper {
        position: relative;
        max-width: 100%;
        max-height: 94vh;
        aspect-ratio: 800 / 920;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 
          0 0 35px rgba(0, 243, 255, 0.2),
          0 0 70px rgba(255, 0, 128, 0.12),
          inset 0 0 20px rgba(0, 243, 255, 0.1);
        border: 2px solid rgba(0, 243, 255, 0.35);
        border-radius: 12px;
        background: #02040a;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Subtle CRT Scanline Overlay */
      #canvas-wrapper::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        z-index: 10;
        background-size: 100% 3px, 6px 100%;
        pointer-events: none;
        opacity: 0.7;
      }

      /* Top Utility Control Bar */
      .quick-controls {
        position: absolute;
        top: 14px;
        right: 18px;
        z-index: 25;
        display: flex;
        gap: 8px;
      }

      .icon-btn {
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(0, 243, 255, 0.4);
        border-radius: 6px;
        color: #00f3ff;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        backdrop-filter: blur(8px);
      }

      .icon-btn:hover {
        background: rgba(0, 243, 255, 0.25);
        box-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
        transform: scale(1.05);
      }

      .icon-btn:active {
        transform: scale(0.95);
      }

      .icon-btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      /* Mobile On-Screen Virtual Controls */
      #mobile-controls {
        display: none;
        position: absolute;
        bottom: 12px;
        left: 0;
        right: 0;
        width: 100%;
        padding: 0 16px;
        z-index: 30;
        justify-content: space-between;
        pointer-events: none;
      }

      .touch-group {
        display: flex;
        gap: 12px;
        pointer-events: auto;
      }

      .touch-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.85);
        border: 2px solid rgba(0, 243, 255, 0.5);
        color: #00f3ff;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        touch-action: none;
        user-select: none;
      }

      .touch-btn.fire-btn {
        width: 76px;
        height: 76px;
        border-color: rgba(255, 0, 128, 0.8);
        color: #ff0080;
        font-size: 15px;
        box-shadow: 0 0 20px rgba(255, 0, 128, 0.4);
      }

      .touch-btn:active {
        background: rgba(0, 243, 255, 0.3);
        transform: scale(0.92);
      }

      .touch-btn.fire-btn:active {
        background: rgba(255, 0, 128, 0.35);
      }

      @media (max-width: 768px), (pointer: coarse) {
        #mobile-controls {
          display: flex;
        }
        #canvas-wrapper {
          max-height: 80vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div class="quick-controls">
        <button id="btn-sound" class="icon-btn" title="Toggle Sound [M]" aria-label="Toggle Sound">
          <svg id="sound-icon-on" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg id="sound-icon-off" viewBox="0 0 24 24" style="display: none;">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
        <button id="btn-pause" class="icon-btn" title="Pause Game [P]" aria-label="Pause Game">
          <svg id="pause-icon" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
          <svg id="play-icon" viewBox="0 0 24 24" style="display: none;">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
      </div>

      <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="800" height="920"></canvas>
      </div>

      <!-- Virtual Controls for Mobile / Touch -->
      <div id="mobile-controls">
        <div class="touch-group">
          <button id="touch-left" class="touch-btn" aria-label="Move Left">◀</button>
          <button id="touch-right" class="touch-btn" aria-label="Move Right">▶</button>
        </div>
        <div class="touch-group">
          <button id="touch-fire" class="touch-btn fire-btn" aria-label="Fire Laser">FIRE</button>
        </div>
      </div>
    </div>

    <script type="module">
      /**
       * NEON GALAXIAN INVADERS
       * Pure HTML5 Canvas 60FPS Arcade Game
       */

      // ==========================================
      // AUDIO SYNTHESIZER (Pure Web Audio API)
      // ==========================================
      class SoundFX {
        constructor() {
          this.ctx = null;
          this.muted = localStorage.getItem('neon_galaxian_muted') === 'true';
          this.masterGain = null;
        }

        init() {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
              this.ctx = new AudioContext();
              this.masterGain = this.ctx.createGain();
              this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.25, this.ctx.currentTime);
              this.masterGain.connect(this.ctx.destination);
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        toggleMute() {
          this.muted = !this.muted;
          localStorage.setItem('neon_galaxian_muted', this.muted);
          if (this.masterGain && this.ctx) {
            this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.25, this.ctx.currentTime);
          }
          return this.muted;
        }

        playShoot() {
          if (this.muted || !this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.12);
          } catch (e) {}
        }

        playEnemyShoot() {
          if (this.muted || !this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.15);
          } catch (e) {}
        }

        playExplosion(isPlayer = false) {
          if (this.muted || !this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const bufferSize = this.ctx.sampleRate * (isPlayer ? 0.6 : 0.25);
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }

            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(isPlayer ? 600 : 900, now);
            filter.frequency.exponentialRampToValueAtTime(30, now + (isPlayer ? 0.6 : 0.25));

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(isPlayer ? 0.8 : 0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + (isPlayer ? 0.6 : 0.25));

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);
            noise.start(now);
          } catch (e) {}
        }

        playDiveSiren() {
          if (this.muted || !this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(580, now);
            osc.frequency.linearRampToValueAtTime(260, now + 0.35);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.35);
          } catch (e) {}
        }

        playBunkerHit() {
          if (this.muted || !this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.06);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.06);
          } catch (e) {}
        }

        playWaveCleared() {
          if (this.muted || !this.ctx) return;
          try {
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, index) => {
              const now = this.ctx.currentTime + index * 0.1;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(freq, now);
              gain.gain.setValueAtTime(0.2, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
              osc.connect(gain);
              gain.connect(this.masterGain);
              osc.start(now);
              osc.stop(now + 0.18);
            });
          } catch (e) {}
        }
      }

      // ==========================================
      // CONSTANTS & PALETTE
      // ==========================================
      const CANVAS_WIDTH = 800;
      const CANVAS_HEIGHT = 920;

      const COLORS = {
        cyan: '#00f3ff',
        cyanGlow: 'rgba(0, 243, 255, 0.85)',
        pink: '#ff007f',
        pinkGlow: 'rgba(255, 0, 127, 0.85)',
        green: '#00ff66',
        greenGlow: 'rgba(0, 255, 102, 0.85)',
        yellow: '#ffd700',
        yellowGlow: 'rgba(255, 215, 0, 0.85)',
        laserEnemy: '#ff2255',
        laserPlayer: '#00ffff',
        bunker: '#00ffaa',
        white: '#ffffff',
        gold: '#ffea00'
      };

      // ==========================================
      // GAME ENGINE & STATE
      // ==========================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const sfx = new SoundFX();

      // Game States
      const STATE = {
        START: 'START',
        PLAYING: 'PLAYING',
        PAUSED: 'PAUSED',
        WAVE_CLEARED: 'WAVE_CLEARED',
        GAME_OVER: 'GAME_OVER'
      };

      let gameState = STATE.START;
      let score = 0;
      let highScore = parseInt(localStorage.getItem('neon_galaxian_high_score') || '0', 10);
      let lives = 3;
      let wave = 1;
      let waveTimer = 0;
      let screenShake = 0;

      // Input management
      const keys = {
        left: false,
        right: false,
        shoot: false
      };

      let touchMoveX = null;
      let shootCooldown = 0;

      // ==========================================
      // STARFIELD BACKGROUND (Multi-Layer Parallax)
      // ==========================================
      const stars = [];
      for (let i = 0; i < 110; i++) {
        stars.push({
          x: Math.random() * CANVAS_WIDTH,
          y: Math.random() * CANVAS_HEIGHT,
          size: Math.random() * 2 + 0.6,
          speed: Math.random() * 1.8 + 0.4,
          opacity: Math.random() * 0.7 + 0.3,
          twinkleSpeed: Math.random() * 0.05 + 0.01,
          twinkleOffset: Math.random() * Math.PI * 2,
          color: i % 4 === 0 ? '#00f3ff' : (i % 6 === 0 ? '#ff007f' : '#ffffff')
        });
      }

      function updateAndDrawStars() {
        ctx.save();
        for (const star of stars) {
          star.y += star.speed;
          if (star.y > CANVAS_HEIGHT) {
            star.y = 0;
            star.x = Math.random() * CANVAS_WIDTH;
          }
          star.twinkleOffset += star.twinkleSpeed;
          const alpha = star.opacity * (0.6 + 0.4 * Math.sin(star.twinkleOffset));
          ctx.fillStyle = star.color;
          ctx.globalAlpha = alpha;
          ctx.fillRect(star.x, star.y, star.size, star.size * (star.speed > 1.4 ? 2.2 : 1));
        }
        ctx.restore();
      }

      // ==========================================
      // PARTICLE EXPLOSION SYSTEM
      // ==========================================
      const particles = [];

      class Particle {
        constructor(x, y, color, vx, vy, size, life) {
          this.x = x;
          this.y = y;
          this.color = color;
          this.vx = vx;
          this.vy = vy;
          this.size = size;
          this.maxLife = life;
          this.life = life;
          this.drag = 0.96;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= this.drag;
          this.vy *= this.drag;
          this.life--;
        }

        draw(ctx) {
          const progress = this.life / this.maxLife;
          ctx.save();
          ctx.globalAlpha = progress;
          ctx.shadowBlur = 8;
          ctx.shadowColor = this.color;
          ctx.fillStyle = this.color;
          ctx.fillRect(this.x - this.size * progress / 2, this.y - this.size * progress / 2, this.size * progress, this.size * progress);
          ctx.restore();
        }
      }

      function createExplosion(x, y, color, count = 28, maxSpeed = 5) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * maxSpeed + 1;
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const size = Math.random() * 4 + 2;
          const life = Math.floor(Math.random() * 25 + 20);
          particles.push(new Particle(x, y, color, vx, vy, size, life));
        }
      }

      // Floating Score Text
      const floatingTexts = [];
      function addFloatingText(text, x, y, color) {
        floatingTexts.push({
          text,
          x,
          y,
          color,
          life: 45,
          maxLife: 45
        });
      }

      function updateAndDrawFloatingTexts() {
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const item = floatingTexts[i];
          item.y -= 0.8;
          item.life--;
          const alpha = item.life / item.maxLife;

          ctx.save();
          ctx.font = '700 13px "Orbitron", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = item.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = item.color;
          ctx.globalAlpha = alpha;
          ctx.fillText(item.text, item.x, item.y);
          ctx.restore();

          if (item.life <= 0) {
            floatingTexts.splice(i, 1);
          }
        }
      }

      // ==========================================
      // DESTRUCTIBLE BUNKERS (Pixel Matrix)
      // ==========================================
      class Bunker {
        constructor(centerX, topY) {
          this.x = centerX;
          this.y = topY;
          this.cols = 18;
          this.rows = 12;
          this.cellSize = 4;
          this.width = this.cols * this.cellSize;
          this.height = this.rows * this.cellSize;
          this.grid = [];
          this.initShape();
        }

        initShape() {
          this.grid = [];
          for (let r = 0; r < this.rows; r++) {
            const row = [];
            for (let c = 0; c < this.cols; c++) {
              let solid = true;
              // Rounded top corners
              if (r < 3) {
                if (c < 3 - r || c >= this.cols - (3 - r)) {
                  solid = false;
                }
              }
              // Hollow arch at bottom center
              if (r >= 7) {
                if (c >= 6 && c <= 11) {
                  solid = false;
                }
              }
              row.push(solid ? 1 : 0);
            }
            this.grid.push(row);
          }
        }

        checkCollision(laserX, laserY, isPlayer) {
          const left = this.x - this.width / 2;
          const top = this.y;

          if (
            laserX >= left &&
            laserX <= left + this.width &&
            laserY >= top &&
            laserY <= top + this.height
          ) {
            const col = Math.floor((laserX - left) / this.cellSize);
            const row = Math.floor((laserY - top) / this.cellSize);

            if (row >= 0 && row < this.rows && col >= 0 && col < this.cols) {
              if (this.grid[row][col] === 1) {
                this.damageCircle(col, row, 2.2);
                sfx.playBunkerHit();
                createExplosion(laserX, laserY, COLORS.bunker, 6, 2.5);
                return true;
              }
            }
          }
          return false;
        }

        damageCircle(centerCol, centerRow, radius) {
          for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
              const dist = Math.hypot(c - centerCol, r - centerRow);
              if (dist <= radius) {
                if (this.grid[r][c] === 1 && Math.random() < 0.85) {
                  this.grid[r][c] = 0;
                }
              }
            }
          }
        }

        draw(ctx) {
          const left = this.x - this.width / 2;
          const top = this.y;
          ctx.save();
          ctx.shadowBlur = 8;
          ctx.shadowColor = COLORS.bunker;
          ctx.fillStyle = COLORS.bunker;

          for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
              if (this.grid[r][c] === 1) {
                ctx.fillRect(
                  left + c * this.cellSize,
                  top + r * this.cellSize,
                  this.cellSize - 0.5,
                  this.cellSize - 0.5
                );
              }
            }
          }
          ctx.restore();
        }
      }

      let bunkers = [];
      function initBunkers() {
        bunkers = [
          new Bunker(150, 710),
          new Bunker(400, 710),
          new Bunker(650, 710)
        ];
      }

      // ==========================================
      // PLAYER SHIP
      // ==========================================
      class Player {
        constructor() {
          this.width = 46;
          this.height = 32;
          this.x = CANVAS_WIDTH / 2;
          this.y = 835;
          this.speed = 6.8;
          this.vx = 0;
          this.alive = true;
          this.invulnerableTimer = 0;
          this.thrusterCycle = 0;
        }

        reset(respawn = false) {
          this.x = CANVAS_WIDTH / 2;
          this.y = 835;
          this.vx = 0;
          this.alive = true;
          this.invulnerableTimer = respawn ? 120 : 0; // 2 seconds invulnerability
        }

        update() {
          if (!this.alive) return;

          // Keyboard movement
          let targetVx = 0;
          if (keys.left) targetVx -= this.speed;
          if (keys.right) targetVx += this.speed;

          // Touch direct targeting
          if (touchMoveX !== null) {
            const diff = touchMoveX - this.x;
            if (Math.abs(diff) > 4) {
              targetVx = Math.sign(diff) * Math.min(Math.abs(diff) * 0.25, this.speed);
            }
          }

          // Smooth acceleration and deceleration
          this.vx += (targetVx - this.vx) * 0.35;
          this.x += this.vx;

          // Boundaries
          const margin = this.width / 2 + 10;
          if (this.x < margin) {
            this.x = margin;
            this.vx = 0;
          }
          if (this.x > CANVAS_WIDTH - margin) {
            this.x = CANVAS_WIDTH - margin;
            this.vx = 0;
          }

          // Invulnerability timer
          if (this.invulnerableTimer > 0) {
            this.invulnerableTimer--;
          }

          this.thrusterCycle++;
          // Thruster particles
          if (this.thrusterCycle % 3 === 0) {
            particles.push(new Particle(
              this.x - 12 + (Math.random() * 4 - 2),
              this.y + 14,
              COLORS.cyan,
              (Math.random() - 0.5) * 1.5,
              Math.random() * 2.5 + 2,
              2.5,
              16
            ));
            particles.push(new Particle(
              this.x + 12 + (Math.random() * 4 - 2),
              this.y + 14,
              COLORS.cyan,
              (Math.random() - 0.5) * 1.5,
              Math.random() * 2.5 + 2,
              2.5,
              16
            ));
          }
        }

        draw(ctx) {
          if (!this.alive) return;

          // Invulnerability flashing effect
          if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 6) % 2 === 0) {
            ctx.save();
            ctx.strokeStyle = COLORS.cyan;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = COLORS.cyan;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 30, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          ctx.save();
          ctx.translate(this.x, this.y);

          // Subtle bank angle when moving
          const tilt = (this.vx / this.speed) * 0.15;
          ctx.rotate(tilt);

          ctx.shadowBlur = 14;
          ctx.shadowColor = COLORS.cyanGlow;

          // Ship Main Wings (Sleek Arcade Delta Profile)
          ctx.fillStyle = '#062038';
          ctx.strokeStyle = COLORS.cyan;
          ctx.lineWidth = 2.2;

          ctx.beginPath();
          ctx.moveTo(0, -16); // Nose
          ctx.lineTo(8, -6);
          ctx.lineTo(22, 10); // Right Wingtip
          ctx.lineTo(16, 14);
          ctx.lineTo(12, 10);
          ctx.lineTo(4, 13);
          ctx.lineTo(0, 8); // Rear center
          ctx.lineTo(-4, 13);
          ctx.lineTo(-12, 10);
          ctx.lineTo(-16, 14);
          ctx.lineTo(-22, 10); // Left Wingtip
          ctx.lineTo(-8, -6);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Cockpit Canopy (Electric Core)
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(0, -4, 3.5, 7, 0, 0, Math.PI * 2);
          ctx.fill();

          // Wing Cannons
          ctx.fillStyle = COLORS.cyan;
          ctx.fillRect(-19, -2, 2.5, 9);
          ctx.fillRect(16.5, -2, 2.5, 9);

          ctx.restore();
        }
      }

      const player = new Player();

      // ==========================================
      // LASERS (Player & Enemy)
      // ==========================================
      const playerLasers = [];
      const enemyLasers = [];

      class Laser {
        constructor(x, y, vy, color, isPlayer = false, vx = 0) {
          this.x = x;
          this.y = y;
          this.vx = vx;
          this.vy = vy;
          this.color = color;
          this.isPlayer = isPlayer;
          this.width = isPlayer ? 3.5 : 4;
          this.height = isPlayer ? 14 : 12;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
        }

        draw(ctx) {
          ctx.save();
          ctx.shadowBlur = 12;
          ctx.shadowColor = this.color;
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 1.5;

          // Glowing energy capsule bolt
          ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
          ctx.strokeRect(this.x - this.width / 2 - 0.5, this.y - this.height / 2 - 0.5, this.width + 1, this.height + 1);

          // Energy Trail
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = this.color;
          ctx.fillRect(this.x - this.width / 4, this.y + (this.isPlayer ? this.height / 2 : -this.height / 2 - 6), this.width / 2, 8);
          ctx.restore();
        }
      }

      // ==========================================
      // INVADERS & FORMATION (Galaxian Diving Mechanics)
      // ==========================================
      class Invader {
        constructor(row, col, type) {
          this.row = row;
          this.col = col;
          this.type = type; // 'FLAGSHIP' (row 0), 'STRIKER' (row 1-2), 'DRONE' (row 3-4)
          this.alive = true;

          this.width = type === 'FLAGSHIP' ? 36 : (type === 'STRIKER' ? 34 : 32);
          this.height = type === 'FLAGSHIP' ? 26 : (type === 'STRIKER' ? 24 : 22);

          // Position in formation relative to formation anchor
          this.relX = col * 68;
          this.relY = row * 46;

          // Absolute position
          this.x = 0;
          this.y = 0;
          this.angle = 0;

          // State Machine: 'FORMATION' | 'DIVING' | 'RETURNING'
          this.mode = 'FORMATION';

          // Dive curve parameters
          this.diveT = 0;
          this.diveSpeed = 0.007;
          this.diveP0 = { x: 0, y: 0 };
          this.diveP1 = { x: 0, y: 0 };
          this.diveP2 = { x: 0, y: 0 };
          this.diveP3 = { x: 0, y: 0 };
          this.hasFiredInDive = false;

          // Points
          if (type === 'FLAGSHIP') {
            this.points = 150;
            this.divePoints = 300;
            this.color = COLORS.yellow;
            this.glow = COLORS.yellowGlow;
          } else if (type === 'STRIKER') {
            this.points = 80;
            this.divePoints = 160;
            this.color = COLORS.pink;
            this.glow = COLORS.pinkGlow;
          } else {
            this.points = 40;
            this.divePoints = 80;
            this.color = COLORS.green;
            this.glow = COLORS.greenGlow;
          }
        }

        startDive(targetX, targetY) {
          if (this.mode !== 'FORMATION') return;
          this.mode = 'DIVING';
          this.diveT = 0;
          this.hasFiredInDive = false;

          // Calculate parametric swooping Bézier flight path
          this.diveP0 = { x: this.x, y: this.y };
          // Loop out slightly upward and outward
          const loopOutDir = (this.col < 4) ? -1 : 1;
          this.diveP1 = {
            x: this.x + loopOutDir * 120,
            y: this.y - 70
          };
          // Swoop through near the player's predicted trajectory
          this.diveP2 = {
            x: targetX + (Math.random() * 80 - 40),
            y: 520
          };
          // Exit below the screen
          this.diveP3 = {
            x: targetX + (Math.random() * 160 - 80),
            y: CANVAS_HEIGHT + 70
          };

          this.diveSpeed = 0.008 + (wave * 0.0015);
          sfx.playDiveSiren();
        }

        updateDiving() {
          this.diveT += this.diveSpeed;
          if (this.diveT <= 1) {
            // Cubic Bézier calculation
            const t = this.diveT;
            const u = 1 - t;
            const tt = t * t;
            const uu = u * u;
            const uuu = uu * u;
            const ttt = tt * t;

            const nextX = uuu * this.diveP0.x + 3 * uu * t * this.diveP1.x + 3 * u * tt * this.diveP2.x + ttt * this.diveP3.x;
            const nextY = uuu * this.diveP0.y + 3 * uu * t * this.diveP1.y + 3 * u * tt * this.diveP2.y + ttt * this.diveP3.y;

            // Orient sprite towards velocity
            const dx = nextX - this.x;
            const dy = nextY - this.y;
            this.angle = Math.atan2(dy, dx) - Math.PI / 2;

            this.x = nextX;
            this.y = nextY;

            // Dive shot when passing middle of screen
            if (!this.hasFiredInDive && this.diveT > 0.45 && this.y < 700) {
              this.hasFiredInDive = true;
              const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
              const laserSpeed = 6 + wave * 0.5;
              enemyLasers.push(new Laser(
                this.x,
                this.y + 12,
                Math.sin(angleToPlayer) * laserSpeed,
                COLORS.laserEnemy,
                false,
                Math.cos(angleToPlayer) * laserSpeed * 0.7
              ));
              sfx.playEnemyShoot();
            }
          } else {
            // Exited off-screen bottom: loop back in from top
            this.mode = 'RETURNING';
            this.y = -40;
            this.x = CANVAS_WIDTH / 2 + (Math.random() * 300 - 150);
          }
        }

        updateReturning(targetX, targetY) {
          // Smooth glide back to formation grid slot
          const dx = targetX - this.x;
          const dy = targetY - this.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 8) {
            this.x = targetX;
            this.y = targetY;
            this.angle = 0;
            this.mode = 'FORMATION';
          } else {
            const speed = 6;
            this.x += (dx / dist) * speed;
            this.y += (dy / dist) * speed;
            this.angle = Math.atan2(dy, dx) - Math.PI / 2;
          }
        }

        draw(ctx, animFrame) {
          if (!this.alive) return;

          ctx.save();
          ctx.translate(this.x, this.y);
          if (this.mode !== 'FORMATION') {
            ctx.rotate(this.angle);
          }

          ctx.shadowBlur = 12;
          ctx.shadowColor = this.glow;
          ctx.strokeStyle = this.color;
          ctx.fillStyle = this.color;
          ctx.lineWidth = 1.8;

          if (this.type === 'FLAGSHIP') {
            // Tier 1: Boss Flagship (Yellow Crowned Galaxian Commander)
            ctx.beginPath();
            ctx.moveTo(0, -12);
            ctx.lineTo(8, -6);
            ctx.lineTo(16, 4);
            ctx.lineTo(12, 10);
            ctx.lineTo(6, 6);
            ctx.lineTo(4, 11);
            ctx.lineTo(0, 7);
            ctx.lineTo(-4, 11);
            ctx.lineTo(-6, 6);
            ctx.lineTo(-12, 10);
            ctx.lineTo(-16, 4);
            ctx.lineTo(-8, -6);
            ctx.closePath();
            ctx.stroke();

            // Glowing Crown Core
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-3, -4, 6, 7);
            ctx.fillStyle = COLORS.yellow;
            ctx.fillRect(-1.5, -2, 3, 3);
          } else if (this.type === 'STRIKER') {
            // Tier 2: Striker (Magenta Crab Invader with 2 Animation Frames)
            const f = animFrame;
            ctx.beginPath();
            ctx.moveTo(-8, -10);
            ctx.lineTo(8, -10);
            ctx.lineTo(14, -2);
            ctx.lineTo(12, 6);
            ctx.lineTo(f ? 16 : 8, f ? 11 : 12);
            ctx.lineTo(4, 6);
            ctx.lineTo(0, 8);
            ctx.lineTo(-4, 6);
            ctx.lineTo(f ? -16 : -8, f ? 11 : 12);
            ctx.lineTo(-12, 6);
            ctx.lineTo(-14, -2);
            ctx.closePath();
            ctx.stroke();

            // Striker Eyes
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-5, -4, 3, 3);
            ctx.fillRect(2, -4, 3, 3);
          } else {
            // Tier 3: Drone (Lime Green Squid Invader with 2 Animation Frames)
            const f = animFrame;
            ctx.beginPath();
            ctx.moveTo(-5, -9);
            ctx.lineTo(5, -9);
            ctx.lineTo(12, -2);
            ctx.lineTo(10, 4);
            ctx.lineTo(f ? 14 : 7, f ? 11 : 9);
            ctx.lineTo(f ? 6 : 2, 7);
            ctx.lineTo(0, 9);
            ctx.lineTo(f ? -6 : -2, 7);
            ctx.lineTo(f ? -14 : -7, f ? 11 : 9);
            ctx.lineTo(-10, 4);
            ctx.lineTo(-12, -2);
            ctx.closePath();
            ctx.stroke();

            // Drone Eyes
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-4, -3, 2.5, 2.5);
            ctx.fillRect(1.5, -3, 2.5, 2.5);
          }

          ctx.restore();
        }
      }

      class Formation {
        constructor() {
          this.invaders = [];
          this.gridX = 140;
          this.gridY = 120;
          this.direction = 1;
          this.stepTimer = 0;
          this.animFrame = 0;
          this.diveTimer = 0;
          this.diveInterval = 180; // 3 seconds at 60 FPS
          this.init();
        }

        init() {
          this.invaders = [];
          this.gridX = 140;
          this.gridY = 110 + Math.min(wave * 8, 48);
          this.direction = 1;
          this.animFrame = 0;
          this.diveTimer = 0;
          this.diveInterval = Math.max(70, 180 - wave * 18);

          // 5 Rows x 8 Columns
          for (let r = 0; r < 5; r++) {
            const type = r === 0 ? 'FLAGSHIP' : (r <= 2 ? 'STRIKER' : 'DRONE');
            for (let c = 0; c < 8; c++) {
              this.invaders.push(new Invader(r, c, type));
            }
          }
        }

        get aliveInvaders() {
          return this.invaders.filter(inv => inv.alive);
        }

        update() {
          const alive = this.aliveInvaders;
          if (alive.length === 0) return;

          // Speed escalates as remaining count drops
          const countFactor = (40 - alive.length) / 40;
          const baseStepDelay = Math.max(4, Math.floor(28 - (wave * 2) - countFactor * 22));

          this.stepTimer++;
          if (this.stepTimer >= baseStepDelay) {
            this.stepTimer = 0;
            this.animFrame = 1 - this.animFrame;

            // Compute formation boundary bounds
            let minX = Infinity;
            let maxX = -Infinity;

            for (const inv of alive) {
              if (inv.mode === 'FORMATION') {
                const curX = this.gridX + inv.relX;
                if (curX < minX) minX = curX;
                if (curX > maxX) maxX = curX;
              }
            }

            const stepSize = 8 + countFactor * 5;
            let edgeHit = false;

            if (this.direction > 0 && maxX + stepSize > CANVAS_WIDTH - 50) {
              edgeHit = true;
            } else if (this.direction < 0 && minX - stepSize < 50) {
              edgeHit = true;
            }

            if (edgeHit) {
              this.direction *= -1;
              this.gridY += 18;
            } else {
              this.gridX += this.direction * stepSize;
            }
          }

          // Update each invader position
          for (const inv of this.invaders) {
            if (!inv.alive) continue;

            const targetX = this.gridX + inv.relX;
            const targetY = this.gridY + inv.relY;

            if (inv.mode === 'FORMATION') {
              inv.x = targetX;
              inv.y = targetY;

              // Check if invaders reached player level
              if (inv.y >= player.y - 20) {
                handlePlayerHit();
              }
            } else if (inv.mode === 'DIVING') {
              inv.updateDiving();

              // Collision with player while diving (Galaxian kamikaze attack)
              if (player.alive && player.invulnerableTimer === 0) {
                const distToPlayer = Math.hypot(inv.x - player.x, inv.y - player.y);
                if (distToPlayer < 28) {
                  inv.alive = false;
                  createExplosion(inv.x, inv.y, inv.color, 30, 6);
                  handlePlayerHit();
                }
              }

              // Collision with bunkers while diving
              for (const bunker of bunkers) {
                const bLeft = bunker.x - bunker.width / 2;
                if (
                  inv.x >= bLeft && inv.x <= bLeft + bunker.width &&
                  inv.y >= bunker.y && inv.y <= bunker.y + bunker.height
                ) {
                  const col = Math.floor((inv.x - bLeft) / bunker.cellSize);
                  const row = Math.floor((inv.y - bunker.y) / bunker.cellSize);
                  bunker.damageCircle(col, row, 4.5);
                  inv.alive = false;
                  createExplosion(inv.x, inv.y, inv.color, 35, 6);
                  sfx.playExplosion(false);
                  break;
                }
              }
            } else if (inv.mode === 'RETURNING') {
              inv.updateReturning(targetX, targetY);
            }
          }

          // Random Formation Shooting
          const shootChance = 0.015 + (wave * 0.005) + countFactor * 0.03;
          if (Math.random() < shootChance && enemyLasers.length < 5 + wave) {
            // Pick an invader at the bottom of an active column
            const bottomInvaders = [];
            for (let c = 0; c < 8; c++) {
              let lowest = null;
              for (const inv of this.invaders) {
                if (inv.alive && inv.col === c && inv.mode === 'FORMATION') {
                  if (!lowest || inv.row > lowest.row) {
                    lowest = inv;
                  }
                }
              }
              if (lowest) bottomInvaders.push(lowest);
            }

            if (bottomInvaders.length > 0) {
              const shooter = bottomInvaders[Math.floor(Math.random() * bottomInvaders.length)];
              enemyLasers.push(new Laser(
                shooter.x,
                shooter.y + shooter.height / 2 + 4,
                5.5 + wave * 0.4,
                COLORS.laserEnemy,
                false
              ));
              sfx.playEnemyShoot();
            }
          }

          // Dynamic Galaxian Diving Trigger
          this.diveTimer++;
          if (this.diveTimer >= this.diveInterval) {
            this.diveTimer = 0;
            // Count current diving aliens
            const divingCount = this.invaders.filter(inv => inv.alive && inv.mode === 'DIVING').length;
            const maxDiving = Math.min(2 + Math.floor(wave / 2), 4);

            if (divingCount < maxDiving) {
              // Prefer flagship commanders or random available invader
              const available = this.invaders.filter(inv => inv.alive && inv.mode === 'FORMATION');
              if (available.length > 0) {
                const candidate = available[Math.floor(Math.random() * available.length)];
                candidate.startDive(player.x, player.y);
              }
            }
          }
        }

        draw(ctx) {
          for (const inv of this.invaders) {
            inv.draw(ctx, this.animFrame);
          }
        }
      }

      const formation = new Formation();

      // ==========================================
      // GAME PLAY LOGIC & COLLISION HANDLERS
      // ==========================================
      function handlePlayerHit() {
        if (!player.alive || player.invulnerableTimer > 0) return;

        player.alive = false;
        lives--;
        screenShake = 18;
        createExplosion(player.x, player.y, COLORS.cyan, 50, 7);
        createExplosion(player.x, player.y, '#ffffff', 20, 9);
        sfx.playExplosion(true);

        if (lives <= 0) {
          setTimeout(() => {
            gameState = STATE.GAME_OVER;
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('neon_galaxian_high_score', highScore);
            }
          }, 1000);
        } else {
          setTimeout(() => {
            player.reset(true);
          }, 1200);
        }
      }

      function firePlayerLaser() {
        if (gameState !== STATE.PLAYING || !player.alive) return;
        if (shootCooldown > 0) return;
        if (playerLasers.length >= 3) return; // Rate-limited maximum simultaneous lasers

        shootCooldown = 12; // ~200ms
        playerLasers.push(new Laser(player.x, player.y - 18, -12, COLORS.laserPlayer, true));
        sfx.playShoot();
      }

      function updateLasers() {
        // Player lasers update & collision
        for (let i = playerLasers.length - 1; i >= 0; i--) {
          const laser = playerLasers[i];
          laser.update();

          let destroyed = false;

          // Check Bunker Collision
          for (const bunker of bunkers) {
            if (bunker.checkCollision(laser.x, laser.y, true)) {
              destroyed = true;
              break;
            }
          }

          // Check Invader Collision
          if (!destroyed) {
            for (const inv of formation.invaders) {
              if (!inv.alive) continue;

              const hitRadius = inv.mode === 'FORMATION' ? (inv.width / 2 + 2) : 20;
              const dist = Math.hypot(laser.x - inv.x, laser.y - inv.y);

              if (dist <= hitRadius) {
                inv.alive = false;
                destroyed = true;

                const earnedPoints = inv.mode === 'FORMATION' ? inv.points : inv.divePoints;
                score += earnedPoints;
                if (score > highScore) {
                  highScore = score;
                  localStorage.setItem('neon_galaxian_high_score', highScore);
                }

                // Visual explosion and floating points
                createExplosion(inv.x, inv.y, inv.color, 28, 5.5);
                addFloatingText(`+${earnedPoints}`, inv.x, inv.y, inv.color);
                sfx.playExplosion(false);

                // Check Wave Cleared
                if (formation.aliveInvaders.length === 0) {
                  gameState = STATE.WAVE_CLEARED;
                  waveTimer = 110;
                  score += 500 * wave; // Wave bonus
                  sfx.playWaveCleared();
                }
                break;
              }
            }
          }

          // Off-screen boundary
          if (laser.y < -20) destroyed = true;

          if (destroyed) {
            playerLasers.splice(i, 1);
          }
        }

        // Enemy lasers update & collision
        for (let i = enemyLasers.length - 1; i >= 0; i--) {
          const laser = enemyLasers[i];
          laser.update();

          let destroyed = false;

          // Check Bunker Collision
          for (const bunker of bunkers) {
            if (bunker.checkCollision(laser.x, laser.y, false)) {
              destroyed = true;
              break;
            }
          }

          // Check Player Collision
          if (!destroyed && player.alive && player.invulnerableTimer === 0) {
            if (
              Math.abs(laser.x - player.x) < player.width / 2 - 4 &&
              Math.abs(laser.y - player.y) < player.height / 2
            ) {
              destroyed = true;
              handlePlayerHit();
            }
          }

          // Off-screen boundary
          if (laser.y > CANVAS_HEIGHT + 20) destroyed = true;

          if (destroyed) {
            enemyLasers.splice(i, 1);
          }
        }
      }

      function resetGame() {
        score = 0;
        lives = 3;
        wave = 1;
        playerLasers.length = 0;
        enemyLasers.length = 0;
        particles.length = 0;
        floatingTexts.length = 0;
        initBunkers();
        formation.init();
        player.reset(false);
        gameState = STATE.PLAYING;
      }

      function startNextWave() {
        wave++;
        playerLasers.length = 0;
        enemyLasers.length = 0;
        formation.init();
        gameState = STATE.PLAYING;
      }

      // ==========================================
      // HEADS-UP DISPLAY (HUD) & GAME SCREENS
      // ==========================================
      function drawHUD() {
        ctx.save();
        ctx.font = '600 13px "Orbitron", sans-serif';
        ctx.textBaseline = 'top';

        // 1UP SCORE
        ctx.textAlign = 'left';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('SCORE', 28, 16);
        ctx.font = '800 17px "Orbitron", sans-serif';
        ctx.fillStyle = COLORS.cyan;
        ctx.shadowBlur = 8;
        ctx.shadowColor = COLORS.cyanGlow;
        ctx.fillText(String(score).padStart(6, '0'), 28, 36);

        // HIGH SCORE
        ctx.textAlign = 'center';
        ctx.font = '600 13px "Orbitron", sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.shadowBlur = 0;
        ctx.fillText('HIGH SCORE', CANVAS_WIDTH / 2, 16);
        ctx.font = '800 17px "Orbitron", sans-serif';
        ctx.fillStyle = COLORS.yellow;
        ctx.shadowBlur = 8;
        ctx.shadowColor = COLORS.yellowGlow;
        ctx.fillText(String(highScore).padStart(6, '0'), CANVAS_WIDTH / 2, 36);

        // CURRENT WAVE
        ctx.textAlign = 'right';
        ctx.font = '600 13px "Orbitron", sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.shadowBlur = 0;
        ctx.fillText('WAVE', CANVAS_WIDTH - 28, 16);
        ctx.font = '800 17px "Orbitron", sans-serif';
        ctx.fillStyle = COLORS.pink;
        ctx.shadowBlur = 8;
        ctx.shadowColor = COLORS.pinkGlow;
        ctx.fillText(`0${wave}`, CANVAS_WIDTH - 28, 36);

        // LIVES DISPLAY (Bottom Left Mini Ships)
        ctx.textAlign = 'left';
        ctx.font = '600 12px "Orbitron", sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.shadowBlur = 0;
        ctx.fillText('SHIPS', 28, CANVAS_HEIGHT - 28);

        for (let i = 0; i < lives; i++) {
          const miniX = 92 + i * 26;
          const miniY = CANVAS_HEIGHT - 22;
          ctx.save();
          ctx.translate(miniX, miniY);
          ctx.scale(0.5, 0.5);
          ctx.fillStyle = COLORS.cyan;
          ctx.shadowBlur = 6;
          ctx.shadowColor = COLORS.cyan;
          ctx.beginPath();
          ctx.moveTo(0, -14);
          ctx.lineTo(14, 10);
          ctx.lineTo(0, 4);
          ctx.lineTo(-14, 10);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        ctx.restore();
      }

      function drawStartScreen() {
        ctx.save();
        // Dim background
        ctx.fillStyle = 'rgba(2, 6, 23, 0.78)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Cyberpunk Retro Game Logo
        ctx.textAlign = 'center';
        ctx.font = '900 48px "Orbitron", sans-serif';
        ctx.shadowBlur = 25;
        ctx.shadowColor = COLORS.cyan;
        ctx.fillStyle = '#ffffff';
        ctx.fillText('NEON GALAXIAN', CANVAS_WIDTH / 2, 230);

        ctx.font = '700 16px "Orbitron", sans-serif';
        ctx.shadowBlur = 10;
        ctx.shadowColor = COLORS.pink;
        ctx.fillStyle = COLORS.pink;
        ctx.fillText('INTERSTELLAR ARCADE DEFENSE', CANVAS_WIDTH / 2, 275);

        // Alien Points Reference Table
        const tableY = 360;
        ctx.font = '600 14px "Orbitron", sans-serif';

        // Yellow Commander
        ctx.save();
        ctx.translate(CANVAS_WIDTH / 2 - 120, tableY);
        ctx.strokeStyle = COLORS.yellow;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = COLORS.yellow;
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        ctx.textAlign = 'left';
        ctx.fillStyle = COLORS.yellow;
        ctx.fillText('= 150 PTS (300 IN FLIGHT)', CANVAS_WIDTH / 2 - 90, tableY + 5);

        // Magenta Striker
        ctx.save();
        ctx.translate(CANVAS_WIDTH / 2 - 120, tableY + 45);
        ctx.strokeStyle = COLORS.pink;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = COLORS.pink;
        ctx.beginPath();
        ctx.rect(-9, -9, 18, 18);
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = COLORS.pink;
        ctx.fillText('= 80 PTS  (160 IN FLIGHT)', CANVAS_WIDTH / 2 - 90, tableY + 50);

        // Green Drone
        ctx.save();
        ctx.translate(CANVAS_WIDTH / 2 - 120, tableY + 90);
        ctx.strokeStyle = COLORS.green;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = COLORS.green;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(10, 9);
        ctx.lineTo(-10, 9);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = COLORS.green;
        ctx.fillText('= 40 PTS  (80 IN FLIGHT)', CANVAS_WIDTH / 2 - 90, tableY + 95);

        // Controls Box
        ctx.textAlign = 'center';
        ctx.font = '500 13px "Orbitron", sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('MOVE: [← / →] OR [A / D]  ·  FIRE: [SPACE]', CANVAS_WIDTH / 2, 570);
        ctx.fillText('PAUSE: [P]  ·  SOUND: [M]  ·  TOUCH CONTROLS ACTIVE', CANVAS_WIDTH / 2, 595);

        // Pulsing Start Prompt
        const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.006);
        ctx.font = '800 20px "Orbitron", sans-serif';
        ctx.fillStyle = COLORS.cyan;
        ctx.shadowBlur = 16 * pulse;
        ctx.shadowColor = COLORS.cyan;
        ctx.globalAlpha = 0.3 + 0.7 * pulse;
        ctx.fillText('PRESS SPACE OR TAP TO LAUNCH', CANVAS_WIDTH / 2, 680);

        ctx.restore();
      }

      function drawWaveClearedScreen() {
        ctx.save();
        ctx.fillStyle = 'rgba(2, 6, 23, 0.6)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.textAlign = 'center';
        ctx.font = '900 36px "Orbitron", sans-serif';
        ctx.fillStyle = COLORS.green;
        ctx.shadowBlur = 20;
        ctx.shadowColor = COLORS.green;
        ctx.fillText(`WAVE 0${wave} CLEARED!`, CANVAS_WIDTH / 2, 420);

        ctx.font = '700 18px "Orbitron", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = COLORS.cyan;
        ctx.fillText(`SECTOR BONUS +${500 * wave} PTS`, CANVAS_WIDTH / 2, 470);

        ctx.font = '500 14px "Orbitron", sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.shadowBlur = 0;
        ctx.fillText('INCOMING HOSTILE FLEET ACCELERATING...', CANVAS_WIDTH / 2, 515);
        ctx.restore();
      }

      function drawGameOverScreen() {
        ctx.save();
        ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.textAlign = 'center';
        ctx.font = '900 48px "Orbitron", sans-serif';
        ctx.fillStyle = '#ff2255';
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#ff2255';
        ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, 360);

        ctx.font = '700 22px "Orbitron", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.shadowColor = COLORS.cyan;
        ctx.fillText(`FINAL SCORE: ${String(score).padStart(6, '0')}`, CANVAS_WIDTH / 2, 430);

        ctx.font = '600 16px "Orbitron", sans-serif';
        ctx.fillStyle = COLORS.yellow;
        ctx.shadowBlur = 10;
        ctx.shadowColor = COLORS.yellow;
        ctx.fillText(`SURVIVED TO WAVE ${wave}`, CANVAS_WIDTH / 2, 475);

        if (score >= highScore && score > 0) {
          ctx.font = '800 18px "Orbitron", sans-serif';
          ctx.fillStyle = COLORS.pink;
          ctx.shadowBlur = 14;
          ctx.shadowColor = COLORS.pink;
          ctx.fillText('★ NEW HIGH SCORE RECORD! ★', CANVAS_WIDTH / 2, 525);
        }

        const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.007);
        ctx.font = '800 18px "Orbitron", sans-serif';
        ctx.fillStyle = COLORS.cyan;
        ctx.shadowBlur = 15 * pulse;
        ctx.shadowColor = COLORS.cyan;
        ctx.globalAlpha = 0.3 + 0.7 * pulse;
        ctx.fillText('PRESS SPACE OR TAP TO RETRY', CANVAS_WIDTH / 2, 620);
        ctx.restore();
      }

      function drawPauseScreen() {
        ctx.save();
        ctx.fillStyle = 'rgba(2, 6, 23, 0.75)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.textAlign = 'center';
        ctx.font = '900 36px "Orbitron", sans-serif';
        ctx.fillStyle = COLORS.cyan;
        ctx.shadowBlur = 20;
        ctx.shadowColor = COLORS.cyan;
        ctx.fillText('PAUSED', CANVAS_WIDTH / 2, 450);

        ctx.font = '600 16px "Orbitron", sans-serif';
        ctx.fillStyle = '#cbd5e1';
        ctx.shadowBlur = 0;
        ctx.fillText('PRESS [P] OR TAP TO RESUME', CANVAS_WIDTH / 2, 495);
        ctx.restore();
      }

      // ==========================================
      // MAIN GAME LOOP (60 FPS requestAnimationFrame)
      // ==========================================
      function gameLoop() {
        // Screen Shake calculation
        let shakeX = 0;
        let shakeY = 0;
        if (screenShake > 0) {
          shakeX = (Math.random() - 0.5) * screenShake;
          shakeY = (Math.random() - 0.5) * screenShake;
          screenShake *= 0.88;
          if (screenShake < 0.5) screenShake = 0;
        }

        ctx.save();
        ctx.translate(shakeX, shakeY);

        // Clear Canvas with slight motion persistence
        ctx.fillStyle = '#02040a';
        ctx.fillRect(-10, -10, CANVAS_WIDTH + 20, CANVAS_HEIGHT + 20);

        // Update & Render Starfield
        updateAndDrawStars();

        // Game State Logic
        if (gameState === STATE.PLAYING) {
          if (shootCooldown > 0) shootCooldown--;
          if (keys.shoot) firePlayerLaser();

          player.update();
          formation.update();
          updateLasers();
        } else if (gameState === STATE.WAVE_CLEARED) {
          player.update();
          waveTimer--;
          if (waveTimer <= 0) {
            startNextWave();
          }
        }

        // Update & Draw Particles (Always active)
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          p.draw(ctx);
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }

        // Draw Bunkers
        for (const bunker of bunkers) {
          bunker.draw(ctx);
        }

        // Draw Invaders
        formation.draw(ctx);

        // Draw Lasers
        for (const laser of playerLasers) laser.draw(ctx);
        for (const laser of enemyLasers) laser.draw(ctx);

        // Draw Player
        player.draw(ctx);

        // Draw Floating Score Pops
        updateAndDrawFloatingTexts();

        // Draw HUD Overlays
        drawHUD();

        // State Screen Overlays
        if (gameState === STATE.START) {
          drawStartScreen();
        } else if (gameState === STATE.PAUSED) {
          drawPauseScreen();
        } else if (gameState === STATE.WAVE_CLEARED) {
          drawWaveClearedScreen();
        } else if (gameState === STATE.GAME_OVER) {
          drawGameOverScreen();
        }

        ctx.restore();
        requestAnimationFrame(gameLoop);
      }

      // ==========================================
      // EVENT LISTENERS & USER INPUT
      // ==========================================
      function handleStartAction() {
        sfx.init();
        if (gameState === STATE.START || gameState === STATE.GAME_OVER) {
          resetGame();
        } else if (gameState === STATE.PAUSED) {
          gameState = STATE.PLAYING;
          updatePauseIcon();
        }
      }

      window.addEventListener('keydown', (e) => {
        sfx.init();
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
          keys.left = true;
          e.preventDefault();
        }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') {
          keys.right = true;
          e.preventDefault();
        }
        if (e.code === 'Space') {
          keys.shoot = true;
          if (gameState === STATE.START || gameState === STATE.GAME_OVER) {
            handleStartAction();
          }
          e.preventDefault();
        }
        if (e.code === 'KeyP') {
          if (gameState === STATE.PLAYING) {
            gameState = STATE.PAUSED;
            updatePauseIcon();
          } else if (gameState === STATE.PAUSED) {
            gameState = STATE.PLAYING;
            updatePauseIcon();
          }
          e.preventDefault();
        }
        if (e.code === 'KeyM') {
          toggleSound();
          e.preventDefault();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'Space') keys.shoot = false;
      });

      // Quick Controls buttons
      const btnSound = document.getElementById('btn-sound');
      const soundIconOn = document.getElementById('sound-icon-on');
      const soundIconOff = document.getElementById('sound-icon-off');

      function updateSoundIcon(muted) {
        soundIconOn.style.display = muted ? 'none' : 'block';
        soundIconOff.style.display = muted ? 'block' : 'none';
      }

      function toggleSound() {
        sfx.init();
        const muted = sfx.toggleMute();
        updateSoundIcon(muted);
      }

      btnSound.addEventListener('click', toggleSound);

      const btnPause = document.getElementById('btn-pause');
      const pauseIcon = document.getElementById('pause-icon');
      const playIcon = document.getElementById('play-icon');

      function updatePauseIcon() {
        const isPaused = gameState === STATE.PAUSED;
        pauseIcon.style.display = isPaused ? 'none' : 'block';
        playIcon.style.display = isPaused ? 'block' : 'none';
      }

      btnPause.addEventListener('click', () => {
        sfx.init();
        if (gameState === STATE.PLAYING) {
          gameState = STATE.PAUSED;
        } else if (gameState === STATE.PAUSED) {
          gameState = STATE.PLAYING;
        }
        updatePauseIcon();
      });

      // Mobile Touch Controls
      const touchLeft = document.getElementById('touch-left');
      const touchRight = document.getElementById('touch-right');
      const touchFire = document.getElementById('touch-fire');

      touchLeft.addEventListener('touchstart', (e) => { e.preventDefault(); sfx.init(); keys.left = true; });
      touchLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
      touchRight.addEventListener('touchstart', (e) => { e.preventDefault(); sfx.init(); keys.right = true; });
      touchRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });

      touchFire.addEventListener('touchstart', (e) => {
        e.preventDefault();
        sfx.init();
        keys.shoot = true;
        if (gameState === STATE.START || gameState === STATE.GAME_OVER) {
          handleStartAction();
        }
      });
      touchFire.addEventListener('touchend', (e) => { e.preventDefault(); keys.shoot = false; });

      // Direct Canvas Touch Interaction
      canvas.addEventListener('pointerdown', (e) => {
        sfx.init();
        if (gameState === STATE.START || gameState === STATE.GAME_OVER || gameState === STATE.PAUSED) {
          handleStartAction();
          return;
        }
        const rect = canvas.getBoundingClientRect();
        touchMoveX = ((e.clientX - rect.left) / rect.width) * CANVAS_WIDTH;
        firePlayerLaser();
      });

      canvas.addEventListener('pointermove', (e) => {
        if (touchMoveX !== null) {
          const rect = canvas.getBoundingClientRect();
          touchMoveX = ((e.clientX - rect.left) / rect.width) * CANVAS_WIDTH;
        }
      });

      window.addEventListener('pointerup', () => {
        touchMoveX = null;
      });

      // Init and start
      initBunkers();
      updateSoundIcon(sfx.muted);
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
